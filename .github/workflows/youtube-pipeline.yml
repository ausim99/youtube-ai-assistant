name: YouTube AI Pipeline

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Content category"
        required: false
        default: "ai-tools"
        type: choice
        options:
          - ai-tools
          - chatgpt
          - claude
          - gemini
          - prompt-engineering
          - automation
          - python
          - ai-agents
          - tech-news
          - productivity
          - business-ai
          - seo
          - coding
          - trending-ai
      resolution:
        description: "Video resolution"
        required: false
        default: "1080x1920"
        type: choice
        options:
          - "1080x1920"
          - "1920x1080"
      visibility:
        description: "Upload visibility"
        required: false
        default: "private"
        type: choice
        options:
          - private
          - public
          - unlisted
      duration:
        description: "Video duration (seconds, max 60 for shorts)"
        required: false
        default: "60"
        type: string

env:
  PIPELINE_CATEGORY: ${{ inputs.category || vars.DEFAULT_CATEGORY || 'ai-tools' }}
  PIPELINE_RESOLUTION: ${{ inputs.resolution || '1080x1920' }}
  PIPELINE_VISIBILITY: ${{ inputs.visibility || 'private' }}
  PIPELINE_DURATION: ${{ inputs.duration || vars.VIDEO_DURATION || '60' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create storage directories
        run: |
          mkdir -p backend/storage/logs backend/storage/videos backend/storage/audio backend/storage/images backend/storage/thumbnails

      - name: Run Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_UPLOAD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_UPLOAD }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DATABASE_URL: sqlite:///./storage/youtube_ai.db
          CHANNEL_LANGUAGE: ${{ vars.CHANNEL_LANGUAGE || 'bn' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'AI Bangla' }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'bn-IN-Wavenet-A' }}
          SHORTS_ENABLED: ${{ vars.SHORTS_ENABLED || 'true' }}
          VIDEO_DURATION: ${{ vars.VIDEO_DURATION || '60' }}
          APP_ENV: production
        run: |
          cd backend
          python run_pipeline.py

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "YouTube AI Bot"
          git config user.email "bot@youtube-ai.local"
          git pull --rebase origin master
          git add data/pipeline_results.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update pipeline results" && git push)

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            backend/storage/logs/
            backend/storage/videos/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import urllib.request, urllib.parse, json, os
          bot = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not bot or not chat:
              print('Telegram not configured, skipping notification')
              exit(0)
          text = f'PIPELINE FAILED\\n\\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          url = f'https://api.telegram.org/bot{bot}/sendMessage'
          data = json.dumps({'chat_id': chat, 'text': text[:4096]}).encode()
          req = urllib.request.Request(url, data, {'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          print('Notification sent')
          "
