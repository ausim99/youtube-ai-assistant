name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff black mypy

      - name: Lint with ruff
        run: |
          ruff check backend/ --ignore F401,E501 --exit-zero

      - name: Type check with mypy
        run: |
          mypy backend/ --ignore-missing-imports --exclude 'tests/' || true

      - name: Run tests with coverage
        run: |
          cd backend
          mkdir -p storage/logs storage/videos storage/audio storage/images storage/thumbnails
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term -p no:warnings

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  dashboard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: TypeScript check
        run: |
          cd dashboard
          npx tsc --noEmit

      - name: Lint
        run: |
          cd dashboard
          npx next lint || true

      - name: Build check
        run: |
          cd dashboard
          npm run build
